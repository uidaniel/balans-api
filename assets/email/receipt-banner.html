<!doctype html>
<!--
  The banner at the top of the CLIENT's payment email.

  Separate from paid-banner.html on purpose: for a while both emails carried
  that one, which is addressed to the person who has just been paid, and it
  was going to the person who had just paid. The wrong reader, on the one
  message a client is most likely to keep, forward to their accounts
  department, or read in another country.

  So this is the formal one. Plain English, nothing addressed to a reader
  who is not the payer, and the only mark on it is the same PAID stamp the
  invoice itself carries. A receipt is a record somebody files; the
  celebration belongs on the freelancer's copy and nowhere else.

  Authored at 1120x448, twice the 560x224 the email shows it at, and
  captured on an opaque background with square corners: layout() rounds the
  <img>, and Outlook, which ignores that, shows square corners on a dark
  picture rather than a light halo around a rounded one.

  Rebranded on 29 October 2026 with the cards the bot sends in WhatsApp:
  night green, the gold 3D render from that card's art (assets/brand/art),
  and Onest in two tones. Keep this file beside the PNG: the picture is the
  only thing the email sends, but this is the only thing that can be edited
  when the copy changes.

  The ribbed gold glass is the invoice breakdown card's
  (assets/brand/art/receipt.jpg), without a 3D object: a receipt is paper.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Onest;font-weight:400;src:url("../fonts/Onest-400.ttf")}
@font-face{font-family:Onest;font-weight:500;src:url("../fonts/Onest-500.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1120px;height:448px}
.banner{position:relative;width:1120px;height:448px;overflow:hidden;background:#08130f;color:#F6F1E7;
  font-family:Onest,sans-serif;-webkit-font-smoothing:antialiased}
.art{position:absolute;display:block}
/* Dark under the words, so they never sit on the light. */
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#08130f 34%,rgb(8 19 15/.6) 52%,transparent 70%)}
.copy{position:absolute;left:64px;top:70px}
.tag{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 24px 0 20px;border-radius:999px;
  background:linear-gradient(180deg,#ffd877,#f5b82e);color:#10231c;font-size:23px;font-weight:500}
.tag svg{width:22px;height:22px}
h1{font-weight:400;font-size:78px;line-height:1;letter-spacing:-.05em}
.tag + h1{margin-top:34px}
h1 span{display:block}
h1 .m{color:rgba(246,241,231,.48)}
.sub{margin-top:26px;font-size:25px;color:rgba(246,241,231,.66)}
/* A message as it is typed, on frosted glass. */
.chat{display:inline-flex;align-items:baseline;gap:18px;margin-top:34px;padding:18px 24px;border-radius:26px 26px 26px 8px;
  background:rgba(246,241,231,.09);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 0 0 2px rgba(246,241,231,.14)}
.chat p{font-size:25px}
.chat span{font-size:17px;color:rgba(246,241,231,.5);white-space:nowrap}
.chips{display:flex;gap:12px;margin-top:30px}
.chips span{height:46px;padding:0 22px;border-radius:999px;display:flex;align-items:center;font-size:21px;
  background:rgba(246,241,231,.09);box-shadow:inset 0 0 0 2px rgba(246,241,231,.14)}
.art{left:0;top:-40px;width:1120px}
.stamp{position:absolute;right:60px;top:50%;transform:translateY(-50%) rotate(-12deg);
  padding:18px 40px;border:6px solid #f5b82e;border-radius:20px;color:#f5b82e;background:rgba(8,19,15,.55);
  font-weight:500;font-size:66px;letter-spacing:.08em}
.ribs{position:absolute;inset:0;display:flex}
.ribs i{flex:1;box-shadow:inset 1.5px 0 0 rgb(255 240 210/.05),inset -1.5px 0 0 rgb(0 0 0/.35)}
.shade{background:linear-gradient(90deg,rgb(8 19 15/.9) 30%,rgb(8 19 15/.45) 52%,rgb(8 19 15/.05) 72%,transparent)}
</style>
</head>
<body>
<div class="banner">
  <div class="ribs"><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 32.5%,#ffe7ad 49.5%,#f5b82e 59.7%,#1f3d32 90.3%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 34.1%,#ffe7ad 51.0%,#f5b82e 61.1%,#1f3d32 91.5%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 35.8%,#ffe7ad 52.3%,#f5b82e 62.2%,#1f3d32 92.0%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 37.5%,#ffe7ad 53.5%,#f5b82e 63.1%,#1f3d32 91.8%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 39.2%,#ffe7ad 54.4%,#f5b82e 63.6%,#1f3d32 91.0%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 40.9%,#ffe7ad 55.2%,#f5b82e 63.7%,#1f3d32 89.5%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 42.4%,#ffe7ad 55.6%,#f5b82e 63.6%,#1f3d32 87.4%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 43.7%,#ffe7ad 55.8%,#f5b82e 63.1%,#1f3d32 84.9%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 44.8%,#ffe7ad 55.7%,#f5b82e 62.3%,#1f3d32 82.0%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 45.6%,#ffe7ad 55.3%,#f5b82e 61.2%,#1f3d32 78.8%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 46.0%,#ffe7ad 54.7%,#f5b82e 59.8%,#1f3d32 75.4%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 46.1%,#ffe7ad 53.7%,#f5b82e 58.3%,#1f3d32 72.0%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 45.8%,#ffe7ad 52.5%,#f5b82e 56.5%,#1f3d32 68.6%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 45.1%,#ffe7ad 51.0%,#f5b82e 54.6%,#1f3d32 65.3%,#08130f 100%)"></i><i style="background:linear-gradient(180deg,#08130f 0%,#0d1d17 43.9%,#ffe7ad 49.3%,#f5b82e 52.6%,#1f3d32 62.4%,#08130f 100%)"></i><i style="background:linear-gr   <div class="shade"></div>
  <div class="copy">
    <span class="tag">
      <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1.5 6.4 4.4 9.3 10.5 3" stroke="#10231c" stroke-width="1.6"
