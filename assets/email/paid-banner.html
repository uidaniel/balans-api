<!doctype html>
<!--
  The banner at the top of both payment emails, as it was drawn.

  Authored at 1120x448, which is the size paid-banner.png is captured at and
  twice the 560x224 the email shows it at — the same 2x the welcome and Pro
  banners use, so it stays sharp on a phone.

  No rounded corners here on purpose: the renderer captures on an opaque
  background, so rounding the picture would leave four white corners on the
  email's cream page. `layout()` rounds the <img> instead, which every mail
  client that matters honours.

  It is the WhatsApp paid card (assets/brand/paid-tonight.jpg) turned on its
  side, its coins and light cropped from the same art, and with the
  settlement line taken off. The card says "in your bank tonight" because it
  is sent within minutes of the payment and the clock is still true; an email
  is kept, and a picture saying "tonight" would still say it next March when
  somebody opens it looking for the receipt.

  Plain English since 29 October 2026: "You've been paid. With Balans."
  replaced "Dem don balans you" here and on the card. It is on the
  freelancer's copy rather than the client's for a reason: the client is
  being thanked, the freelancer is being congratulated, and only one of those
  is a moment.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Onest;font-weight:400;src:url("../fonts/Onest-400.ttf")}
@font-face{font-family:Onest;font-weight:500;src:url("../fonts/Onest-500.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1120px;height:448px}
.banner{position:relative;width:1120px;height:448px;overflow:hidden;background:#08130f;color:#F6F1E7;
  font-family:Onest,sans-serif;-webkit-font-smoothing:antialiased}
/* The coins and their light, from the card's own art. */
.art{position:absolute;left:180px;top:-450px;width:940px}
/* Dark under the words, so they never sit on the light. */
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#08130f 34%,rgb(8 19 15/.6) 52%,transparent 70%)}
.copy{position:absolute;left:64px;top:70px}
.tag{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 24px 0 20px;border-radius:999px;
  background:linear-gradient(180deg,#ffd877,#f5b82e);color:#10231c;font-size:23px;font-weight:500}
.tag svg{width:22px;height:22px}
h1{margin-top:34px;font-weight:400;font-size:78px;line-height:1;letter-spacing:-.05em}
h1 span{display:block}
h1 .m{color:rgba(246,241,231,.48)}
.sub{margin-top:26px;font-size:25px;color:rgba(246,241,231,.66)}
</style>
</head>
<body>
<div class="banner">
  <img class="art" src="../brand/art/paid-tonight.jpg" alt="">
  <div class="shade"></div>
  <div class="copy">
    <span class="tag">
      <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1.5 6.4 4.4 9.3 10.5 3" stroke="#10231c" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Payment received
    </span>
    <h1><span>You’ve been paid.</span><span class="m">With Balans.</span></h1>
    <p class="sub">The receipt and the paid invoice are attached.</p>
  </div>
</div>
</body>
</html>
